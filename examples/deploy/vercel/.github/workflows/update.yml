name: Atlas update
on: pull_request
permissions:
  contents: read

jobs:
  build:
    name: Atlas deployment build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: |
          test -s public/index.html
          test -s public/admin/settings.js
          test -s public/admin/settings.css
          node --input-type=module -e "import { GET } from './api/atlas.ts'; const response = await GET(new Request('https://atlas.example/readyz')); if (response.status !== 503 || !(await response.text()).includes('ATLAS CANNOT START')) process.exit(1)"

  merge:
    needs: build
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: >-
          steps.meta.outputs.dependency-names == '@crvouga/atlas' &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch')
        env:
          PR: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$PR" --auto --squash --match-head-commit "$HEAD_SHA"
